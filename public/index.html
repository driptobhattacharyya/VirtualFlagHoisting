<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Virtual Flag Hoisting – raise the Tiranga with a hand gesture</title>
  <meta name="description" content="Hoist the Indian national flag in your browser: pinch your fingers in front of the camera and pull down like a real halyard, or drag the rope. Fireworks when it reaches the top. Video never leaves your device.">
  <meta name="theme-color" content="#ff9933">
  <link rel="canonical" href="https://virtual-flag-hoisting.driptobhattacharyya.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Virtual Flag Hoisting">
  <meta property="og:title" content="Virtual Flag Hoisting">
  <meta property="og:description" content="Pinch and pull in front of your camera to hoist the Indian flag, then enjoy the fireworks. Runs entirely in your browser.">
  <meta property="og:url" content="https://virtual-flag-hoisting.driptobhattacharyya.com/">
  <meta property="og:image" content="https://virtual-flag-hoisting.driptobhattacharyya.com/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Illustration of the Red Fort in Delhi under a blue sky">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" as="image" href="img/background.webp" type="image/webp">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-state="start" data-mode="none" data-tracking="off" data-progress="0">
  <div id="scene" aria-hidden="true"></div>

  <canvas id="stage" role="img" aria-label="A flagpole in front of the Red Fort with the Indian national flag and its hoisting rope"></canvas>

  <!-- Hoisting HUD: camera preview and instructions -->
  <div id="hud" hidden>
    <div id="camera" hidden>
      <video id="video" playsinline muted aria-label="Mirrored preview of your camera"></video>
      <canvas id="overlay" aria-hidden="true"></canvas>
    </div>
    <div id="instructions" class="panel">
      <p id="instruction-1"></p>
      <p id="instruction-2"></p>
      <p id="instruction-3" class="hint"></p>
    </div>
  </div>

  <!-- Celebration banners -->
  <div id="jai-hind" class="panel banner" hidden>JAI HIND</div>
  <div id="celebration" hidden>
    <div class="panel banner">
      <p class="headline">Happy Independence Day!</p>
      <p class="date">15 August</p>
    </div>
    <button id="again" type="button" class="btn" hidden>Hoist again</button>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <p id="announcer" class="visually-hidden" aria-live="polite"></p>

  <!-- Start screen -->
  <div id="start" class="overlay">
    <main class="card">
      <div class="tricolour" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>Virtual Flag Hoisting</h1>
      <p class="lead">Pinch your thumb and index finger in front of your camera and pull down, like hauling a rope, to raise the Indian flag.</p>
      <div class="actions">
        <button id="start-camera" type="button" class="btn btn-primary">Start with camera</button>
        <button id="start-drag" type="button" class="btn">Play without camera</button>
      </div>
      <p id="start-status" class="status" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span><span id="start-status-text"></span>
      </p>
      <p class="privacy">Your camera video is processed entirely on this device. It is never recorded or uploaded.</p>
      <noscript><p class="privacy">This page needs JavaScript to run.</p></noscript>
    </main>
  </div>
</body>
</html>
